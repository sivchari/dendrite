tools:
  # GitHub Releases (tar.gz)
  - name: aquaproj/aqua@v2.39.0
    asset:
      darwin/arm64: aqua_darwin_arm64.tar.gz
      darwin/amd64: aqua_darwin_amd64.tar.gz
      linux/amd64: aqua_linux_amd64.tar.gz

  # GitHub Releases (per-platform format)
  - name: cli/cli@v2.87.0
    asset:
      darwin/arm64: gh_{version}_macOS_arm64.zip
      darwin/amd64: gh_{version}_macOS_amd64.zip
      linux/amd64: gh_{version}_linux_amd64.tar.gz
    bins:
      - gh

  # Non-GitHub URL (per-platform)
  - name: google/cloud-sdk@v529.0.0
    url:
      darwin/arm64: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{version}-darwin-arm.tar.gz
      linux/amd64: https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-{version}-linux-x86_64.tar.gz
    bins:
      - gcloud

  # Custom version prefix
  - name: golang/go@go1.26.0
    asset:
      darwin/arm64: go{version}.darwin-arm64.tar.gz
      darwin/amd64: go{version}.darwin-amd64.tar.gz
      linux/amd64: go{version}.linux-amd64.tar.gz
    version_prefix: "go"
    bins:
      - go
